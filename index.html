<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reading Room</title>

    <!-- Font Awesome icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cookie&display=swap" rel="stylesheet">
</head>
<body>

    <video
        id="backgroundVideo"
        autoplay
        muted
        loop>

    </video>

    <div class="page-overlay">

        <div class="top-panel">

            <h1>Reading Room</h1>

            <div class="controls">

                <div class="control-block">

                    <p class="control-title">
                        Scene
                    </p>

                    <div class="control-row">

                        <button
                            id="randomVideoBtn"
                            class="icon-button">

                            <i id="randomVideoIcon" class="fa-solid fa-wand-sparkles fa-flip-horizontal"></i>
                        </button>

                        <div class="select-wrapper">

                            <select
                                id="videoSelect"
                                class="custom-select">
                            </select>

                            <i class="fa-solid fa-chevron-down"></i>

                        </div>

                    </div>

                </div> 

                <!-- BLOCK 2 -->
                <div class="control-block">

                    <p class="control-title">
                        Sound Effects
                    </p>
                    
                    <div class="control-row">

                        <button
                            id="randomSoundBtn"
                            class="icon-button">

                            <i id="randomSoundIcon" class="fa-solid fa-wand-sparkles fa-flip-horizontal"></i>
                        </button>

                        <button
                            id="soundDropdownBtn"
                            class="dropdown-trigger">

                            <span>Sound Effects</span>

                            <i class="fa-solid fa-chevron-down"></i>
                        </button>

                        <div id="soundDropdown" class="dropdown-panel">

                        </div>

                    </div>

                </div>

                <!-- BLOCK 3 -->
                <div class="control-block">

                    <div class="music-header">

                        <p class="control-title">
                            Music
                        </p>

                        <input
                            id="musicVolume"
                            class="volume-slider"
                            type="range"
                            min="0"
                            max="100"
                            value="50">

                    </div>

                    <div class="control-row">

                        <button
                            id="randomMusicBtn"
                            class="icon-button">

                            <i id="randomMusicIcon"
                            class="fa-solid fa-wand-sparkles fa-flip-horizontal"></i>
                        </button>

                        <div class="select-wrapper">

                            <select
                                id="musicSelect"
                                class="custom-select">
                            </select>

                            <i class="fa-solid fa-chevron-down"></i>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="bottom-flex">

            <div class="quote-box">

                <p id="quoteText">
                    Quote goes here
                </p>

                <p id="quoteSource">
                    Character - Book title
                </p>

                <div class="quote-buttons">

                    <button id="previousQuote">
                        <i id="quotePreviousIcon" class="fa-solid fa-backward"></i>
                    </button>

                    <button id="quotePlayPause">
                        <i id="quotePlayIcon" class="fa-solid fa-play"></i>
                    </button>

                    <button id="nextQuote">
                        <i id="quoteNextIcon" class="fa-solid fa-forward"></i>
                    </button>

                </div>

            </div>

            <div class="clock-container">

                <!-- Animation sits above clock -->
                <div id="animationContainer">

                </div>

                <div class="clock-box">

                    <div id="clock">
                        00:00
                    </div>

                    <div class="clock-buttons">

                        <button id="resetClock">
                            <i id="resetIcon" class="fa-solid fa-rotate-left"></i>
                        </button>

                        <button id="startClock">
                            <i id="playIcon" class="fa-solid fa-play"></i>
                        </button>

                    </div>

                </div>

            </div>

            <div class="book-box">

                <div class="book-content">

                    <img
                        id="bookCover"
                        alt="Book Cover">

                    <div class="book-right">

                        <div class="book-search">

                            <input
                                id="bookInput"
                                type="text"
                                placeholder="Search a book...">

                            <button id="searchBookBtn">

                                <i class="fa-solid fa-magnifying-glass"></i>

                            </button>

                        </div>

                        <div class="book-info">

                            <p id="bookTitle"></p>

                            <p id="bookAuthor"></p>

                            <p id="bookPublished"></p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
